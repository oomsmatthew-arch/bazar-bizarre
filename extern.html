<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween · Entertainment</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f6450">
<link rel="icon" href="assets/logo-cp.png">
<script>
// ---------------- DE DEELLINK VOOR EXTERNEN: entertainmentvm.be/extern ----------------
// Bewust een gewoon bestand (extern.html) en geen map (extern/index.html): GitHub Pages
// serveert /extern dan rechtstreeks. Een map gaf eerst een doorverwijzing /extern → /extern/,
// en die loopt op een toestel dat de app al kent via de offline-laag (sw.js). In Opera GX
// gaf /extern toen een lege pagina; vermoedelijk die doorverwijzing — zonder valt ze weg.
// Voor gidsen en andere buitenstaanders. Wie deze link opent, is meteen binnen als het
// gedeelde account "Extern" en komt op Halloween terecht — zonder toegangscode, zonder
// naam te kiezen.
//
// Waarom dat veilig kan: een extern account ziet enkel Halloween (EXTERN_TOEGANG in
// js/kern.js), en Halloween haalt niets uit de database — alles staat in de code van de
// pagina zelf, die toch al openbaar op de website staat. Dit toestel krijgt de
// toegangscode dus nooit en kan niets uit de database lezen of erin schrijven (zie
// isExternToestel in js/inventaris.js).
//
// Is er op dit toestel al een collega ingelogd (bv. jij, om de link te testen), dan blijft
// die ingelogd: we gaan gewoon naar Halloween. Anders wordt het Extern, en dat blijft het
// ook als de gids de app later opnieuw opent.
(function(){
  try{
    var u=JSON.parse(localStorage.getItem('bb_current_user')||'null');
    var laatst=+(localStorage.getItem('bb_laatst_actief')||0)||0;
    var nogIngelogd=u && u.id!=='extern' &&
      (localStorage.getItem('bb_remember_user')==='1' || (laatst && Date.now()-laatst<6*60*60*1000));
    if(!nogIngelogd){
      localStorage.setItem('bb_current_user',JSON.stringify({id:'extern',naam:'Extern'}));
      localStorage.setItem('bb_remember_user','1');
      localStorage.setItem('bb_laatst_actief',String(Date.now()));
    }
  }catch(e){}
  location.replace('paginas/halloween.html');
})();
</script>
</head>
<body style="font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef3ec;color:#1d2e22;padding:24px">
  <p>Even geduld… <a href="paginas/halloween.html">Naar Halloween</a></p>
</body>
</html>
